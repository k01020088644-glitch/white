<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피스톤 속 분자 반응</title>
<style>
  :root{
    --paper:#EEF2ED;
    --paper2:#E4EAE3;
    --ink:#1B2A23;
    --inkfade:#5B6B61;
    --blue:#2A5C8A;
    --blueSoft:#3E6E9C;
    --red:#B4483F;
    --redSoft:#C15C53;
    --line:#C7D0C8;
    --good:#3F7D5C;
    --bad:#A23B3B;
    --accent:#C98A2B;
    --wall:#8B958E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(120,140,125,0.08) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(120,140,125,0.08) 28px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:18px 12px 40px;
  }
  .wrap{max-width:600px;margin:0 auto;}
  header{margin-bottom:18px;}
  h1{
    font-family: Georgia, "Iowan Old Style", serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--inkfade);font-size:14px;margin:0;line-height:1.5;}
  .scorebar{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:14px;padding-top:10px;border-top:1px solid var(--line);
    font-size:13px;color:var(--inkfade);
  }
  .scorebar b{color:var(--ink);font-size:15px;}
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    padding:20px 18px 22px;
    margin-top:16px;
  }
  .prompt{font-size:15px;line-height:1.6;margin:0 0 14px;}
  .prompt .eq{
    display:block;margin-top:6px;font-family:Georgia,serif;font-size:16px;color:var(--blue);
  }
  .stage{
    display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0 10px;
  }
  .containerBlock{text-align:center;}
  .containerBlock .label{font-size:12px;color:var(--inkfade);margin-bottom:4px;}
  svg.vessel{width:150px;max-width:38vw;height:auto;display:block;margin:0 auto;}
  .arrow{font-size:22px;color:var(--wall);padding:0 4px;}
  .legend{
    display:flex;gap:14px;justify-content:center;align-items:center;
    font-size:12.5px;color:var(--inkfade);margin:8px 0 18px;
  }
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .dotA{background:var(--blue);}
  .dotB{background:var(--red);}
  .question{font-size:15px;font-weight:600;margin:16px 0 12px;}
  .choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
  @media (max-width:400px){.choices{grid-template-columns:1fr 1fr;}}
  .choice{
    border:1.5px solid var(--line);
    background:var(--paper2);
    border-radius:4px;
    padding:11px 8px;
    font-size:15px;
    font-family:Georgia,serif;
    text-align:center;
    cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .choice:hover:not(:disabled){border-color:var(--blue);}
  .choice:disabled{cursor:default;}
  .choice.correct{background:#E4F0E9;border-color:var(--good);color:var(--good);}
  .choice.wrong{background:#F5E6E4;border-color:var(--bad);color:var(--bad);}
  .feedback{
    margin-top:16px;padding:13px 14px;border-radius:4px;font-size:14px;line-height:1.65;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:#E4F0E9;border:1px solid var(--good);}
  .feedback.no{background:#F5E6E4;border:1px solid var(--bad);}
  .feedback .verdict{font-weight:700;margin-bottom:6px;}
  .feedback .verdict.ok{color:var(--good);}
  .feedback .verdict.no{color:var(--bad);}
  .expl{margin-top:8px;color:var(--ink);}
  .expl div{margin-bottom:3px;}
  .actions{margin-top:18px;display:flex;justify-content:flex-end;}
  button.next{
    background:var(--accent);color:#fff;border:none;border-radius:4px;
    padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;
    display:none;
  }
  button.next.show{display:inline-block;}
  button.next:hover{opacity:0.9;}
  .hint{font-size:12px;color:var(--inkfade);margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>피스톤 속 분자 반응</h1>
    <p class="sub">AB(g)와 B₂(g)가 반응해 X(g)를 만드는 모형 문제를 무한히 연습합니다. 온도와 압력은 항상 일정합니다.</p>
    <div class="scorebar">
      <span>이번 세트 정답률</span>
      <span><b id="scoreCorrect">0</b> / <span id="scoreTotal">0</span></span>
    </div>
  </header>

  <div class="card">
    <p class="prompt">그림은 AB(g)와 B₂(g)가 반응하여 X(g)를 생성하는 반응을 모형으로 나타낸 것이다. X의 모형은 나타내지 않았다.
      <span class="eq" id="eqLine"></span>
    </p>

    <div class="stage">
      <div class="containerBlock">
        <div class="label">반응 전</div>
        <svg class="vessel" id="beforeSvg" viewBox="0 0 190 240"></svg>
      </div>
      <div class="arrow">→</div>
      <div class="containerBlock">
        <div class="label">반응 후</div>
        <svg class="vessel" id="afterSvg" viewBox="0 0 190 240"></svg>
      </div>
    </div>

    <div class="legend">
      <span><i class="dot dotA"></i>A</span>
      <span><i class="dot dotB"></i>B</span>
    </div>

    <p class="question">X의 화학식으로 가장 적절한 것은? (A와 B는 임의의 원소 기호이다.)</p>
    <div class="choices" id="choices"></div>

    <div class="feedback" id="feedback">
      <div class="verdict" id="verdict"></div>
      <div class="expl" id="expl"></div>
    </div>

    <div class="actions">
      <button class="next" id="nextBtn">다음 문제</button>
    </div>
    <p class="hint">힌트: 반응 전후 원자의 종류와 개수는 절대 변하지 않습니다. A 원자 수와 B 원자 수를 각각 세어 보세요.</p>
  </div>
</div>

<script>
const BLUE = getCss('--blue'), RED = getCss('--red'), WALL = getCss('--wall');
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

let score = {correct:0, total:0};
let current = null;
let answered = false;

const TEMPLATES = [
  {name:'AB2', p0:2, q0:1, r0:2, m:1, n:2},
  {name:'AB3', p0:1, q0:1, r0:1, m:1, n:3},
];

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function choice(arr){return arr[randInt(0,arr.length-1)];}
function formulaText(m,n){
  const aPart = 'A' + (m>1? m : '');
  const bPart = 'B' + (n>1? n : '');
  return aPart+bPart;
}

function genProblem(){
  const t = choice(TEMPLATES);
  const k = randInt(1,2);
  const p = t.p0*k, q = t.q0*k, r = t.r0*k; // reacted amounts
  const extraB2 = Math.random() < 0.65 ? randInt(0,2) : 0;

  const beforeAB = p;
  const beforeB2 = q + extraB2;
  const afterX = r;
  const afterB2 = extraB2;

  const beforeTotal = beforeAB + beforeB2;
  const afterTotal = afterX + afterB2;

  return {
    template:t, k, p, q, r,
    beforeAB, beforeB2, afterX, afterB2,
    beforeTotal, afterTotal,
    m:t.m, n:t.n
  };
}

// ---------- SVG rendering ----------
const FRAME_H = 240;
const WALL_TOP = 8;
const WALL_BOTTOM = 224;
const WALL_LEFT = 14;
const WALL_RIGHT = 176;
const UNIT_PX = 22;
const MIN_GAS = 46;
const MAX_GAS = WALL_BOTTOM - WALL_TOP - 12;

function gasHeightFor(totalMol){
  return Math.max(MIN_GAS, Math.min(MAX_GAS, totalMol*UNIT_PX));
}

function placePositions(count, xmin, xmax, ymin, ymax, minDist){
  const pts = [];
  for(let i=0;i<count;i++){
    let best=null, bestScore=-1;
    for(let tries=0; tries<40; tries++){
      const x = xmin + Math.random()*(xmax-xmin);
      const y = ymin + Math.random()*(ymax-ymin);
      let minD = Infinity;
      for(const p of pts){
        const d = Math.hypot(p.x-x, p.y-y);
        if(d<minD) minD=d;
      }
      if(pts.length===0){best={x,y};break;}
      if(minD >= minDist){best={x,y};break;}
      if(minD > bestScore){bestScore=minD; best={x,y};}
    }
    pts.push(best);
  }
  return pts;
}

function abMoleculeSvg(cx,cy,angle){
  const dx = 9*Math.cos(angle), dy = 9*Math.sin(angle);
  const ax = cx-dx, ay = cy-dy, bx = cx+dx, by = cy+dy;
  return `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${WALL}" stroke-width="2" opacity="0.5"/>
    <circle cx="${ax}" cy="${ay}" r="8" fill="${BLUE}"/>
    <circle cx="${bx}" cy="${by}" r="8" fill="${RED}"/>`;
}
function b2MoleculeSvg(cx,cy,angle){
  const dx = 8.5*Math.cos(angle), dy = 8.5*Math.sin(angle);
  const ax = cx-dx, ay = cy-dy, bx = cx+dx, by = cy+dy;
  return `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${WALL}" stroke-width="2" opacity="0.5"/>
    <circle cx="${ax}" cy="${ay}" r="8" fill="${RED}"/>
    <circle cx="${bx}" cy="${by}" r="8" fill="${RED}"/>`;
}
function xMoleculeSvg(cx,cy,n,angle){
  let s = `<circle cx="${cx}" cy="${cy}" r="9" fill="${BLUE}"/>`;
  const dist = 15;
  for(let i=0;i<n;i++){
    const a = angle + (i/n)*Math.PI*2;
    const bx = cx + dist*Math.cos(a), by = cy + dist*Math.sin(a);
    s += `<line x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}" stroke="${WALL}" stroke-width="2" opacity="0.5"/>
      <circle cx="${bx}" cy="${by}" r="7.5" fill="${RED}"/>`;
  }
  return s;
}

function renderVessel(svgEl, molecules, totalMol){
  const gasH = gasHeightFor(totalMol);
  const pistonY = WALL_BOTTOM - gasH;
  const innerLeft = WALL_LEFT+6, innerRight = WALL_RIGHT-6;

  const positions = placePositions(molecules.length, innerLeft+8, innerRight-8, pistonY+16, WALL_BOTTOM-12, 34);

  let inner = '';
  molecules.forEach((mol, i) => {
    const pos = positions[i];
    const angle = Math.random()*Math.PI*2;
    if(mol.type==='AB') inner += abMoleculeSvg(pos.x,pos.y,angle);
    else if(mol.type==='B2') inner += b2MoleculeSvg(pos.x,pos.y,angle);
    else if(mol.type==='X') inner += xMoleculeSvg(pos.x,pos.y,mol.n,angle);
  });

  svgEl.innerHTML = `
    <rect x="${WALL_LEFT}" y="${WALL_TOP}" width="${WALL_RIGHT-WALL_LEFT}" height="${WALL_BOTTOM-WALL_TOP}"
      fill="#F7F9F6" stroke="${WALL}" stroke-width="3" stroke-linecap="square"/>
    <rect x="${WALL_LEFT-2}" y="${pistonY-5}" width="${WALL_RIGHT-WALL_LEFT+4}" height="8" fill="${WALL}"/>
    <rect x="${(WALL_LEFT+WALL_RIGHT)/2-6}" y="${WALL_TOP-4}" width="12" height="${pistonY-WALL_TOP-1}" fill="${WALL}" opacity="0.85"/>
    <g>${inner}</g>
  `;
}

function drawProblem(p){
  const beforeMols = [];
  for(let i=0;i<p.beforeAB;i++) beforeMols.push({type:'AB'});
  for(let i=0;i<p.beforeB2;i++) beforeMols.push({type:'B2'});
  const afterMols = [];
  for(let i=0;i<p.afterX;i++) afterMols.push({type:'X', n:p.n});
  for(let i=0;i<p.afterB2;i++) afterMols.push({type:'B2'});

  renderVessel(document.getElementById('beforeSvg'), shuffle(beforeMols), p.beforeTotal);
  renderVessel(document.getElementById('afterSvg'), shuffle(afterMols), p.afterTotal);

  document.getElementById('eqLine').textContent =
    `${p.p}AB(g) + ${p.q}B₂(g) → ${p.r}X(g)` + (p.beforeB2>p.q ? `  (B₂ ${p.beforeB2-p.q}몰 반응하지 않고 남음)` : '');
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ---------- Choices / answer logic ----------
const ALL_FORMULAS = [
  {label:'AB', m:1, n:1},
  {label:'AB2', m:1, n:2},
  {label:'AB3', m:1, n:3},
  {label:'A2B', m:2, n:1},
  {label:'A3B', m:3, n:1},
];

function renderChoices(p){
  const correctLabel = formulaText(p.m, p.n);
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  const opts = shuffle(ALL_FORMULAS);
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = subscript(o.label);
    btn.dataset.label = o.label;
    btn.onclick = () => selectAnswer(btn, o.label, correctLabel);
    choicesEl.appendChild(btn);
  });
}
function subscript(label){
  return label.replace(/(\d+)/g, '<sub>$1</sub>');
}

function selectAnswer(btn, chosen, correctLabel){
  if(answered) return;
  answered = true;
  score.total++;
  const isCorrect = chosen === correctLabel;
  if(isCorrect) score.correct++;
  document.getElementById('scoreCorrect').textContent = score.correct;
  document.getElementById('scoreTotal').textContent = score.total;

  document.querySelectorAll('.choice').forEach(b => {
    b.disabled = true;
    if(b.dataset.label === correctLabel) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
  });

  showFeedback(isCorrect, current);
  document.getElementById('nextBtn').classList.add('show');
}

function showFeedback(isCorrect, p){
  const fb = document.getElementById('feedback');
  const verdict = document.getElementById('verdict');
  const expl = document.getElementById('expl');
  fb.className = 'feedback show ' + (isCorrect ? 'ok':'no');
  verdict.className = 'verdict ' + (isCorrect ? 'ok':'no');
  verdict.textContent = isCorrect ? '정답입니다.' : '오답입니다.';

  const aCount = p.p;
  const bCount = p.p + p.q*2;
  expl.innerHTML = `
    <div>반응 전 A 원자 수 = ${p.p}, B 원자 수 = ${p.p} + ${p.q}×2 = ${bCount}</div>
    <div>원자의 종류와 개수는 반응 후에도 그대로 보존되므로, X ${p.r}분자에 A 원자 ${aCount}개, B 원자 ${bCount}개가 들어 있어야 합니다.</div>
    <div>X 1분자당 A 원자 ${(aCount/p.r).toFixed(0)}개, B 원자 ${(bCount/p.r).toFixed(0)}개 → X의 화학식은 <b>${subscript(formulaText(p.m,p.n))}</b></div>
    <div>반응 전 전체 분자 수 ${p.beforeTotal} : 반응 후 전체 분자 수 ${p.afterTotal} 이므로, 일정한 온도·압력에서 부피비도 ${p.beforeTotal} : ${p.afterTotal} 입니다.</div>
  `;
}

function nextProblem(){
  answered = false;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').classList.remove('show');
  current = genProblem();
  drawProblem(current);
  renderChoices(current);
}

document.getElementById('nextBtn').onclick = nextProblem;

nextProblem();
</script>
</body>
</html>
